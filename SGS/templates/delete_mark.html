
{% extends 'base.html' %}

{% block title %}Delete Marks{% endblock %}

{% block content %}

<h2>Delete Marks</h2>

<p>
    Are you sure you want to delete the marks for
    <strong>{{ mark.subject.name }}</strong>
    of student <strong>{{ student.name }}</strong>?
</p>

<p>
    Marks obtained: {{ mark.marks_obtained }}
</p>

<form method="POST">
    {% csrf_token %}

    <button type="submit">Yes, Delete Marks</button>

    <a href="{% url 'student_detail' student.id %}">
        Cancel
    </a>
</form>

{% endblock %}
