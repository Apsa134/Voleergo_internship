
{% extends 'base.html' %}

{% block content %}

<h2>Delete Subject</h2>

<p>Are you sure you want to delete <strong>{{ subject.name }}</strong>?</p>

<p>Warning: Deleting this subject will also delete all marks recorded for it for every student.</p>

<form method="POST">
    {% csrf_token %}
    <button type="submit">Confirm Delete</button>
</form>

<a href="{% url 'subject_list' %}">Cancel</a>

{% endblock %}
