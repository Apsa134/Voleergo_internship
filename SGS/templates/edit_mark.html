
{% extends 'base.html' %}

{% block title %}Edit Marks{% endblock %}

{% block content %}

<h2>Edit Marks for {{ student.name }}</h2>

<p>Subject: {{ mark.subject.name }}</p>

<form method="POST">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">Update Marks</button>
</form>

<a href="{% url 'student_detail' student.id %}">
    Back to Student Details
</a>

{% endblock %}
