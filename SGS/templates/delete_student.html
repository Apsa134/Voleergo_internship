
{% extends 'base.html' %}

{% block title %}Delete Student{% endblock %}

{% block content %}

<h2>Delete Student</h2>

<p>
    Are you sure you want to delete
    <strong>{{ student.name }}</strong>?
</p>

<p>This will also delete the student's associated marks.</p>

<form method="POST">
    {% csrf_token %}

    <button type="submit">Yes, Delete</button>

    <a href="{% url 'student_list' %}">Cancel</a>
</form>

{% endblock %}
