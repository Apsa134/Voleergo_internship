{% extends 'base.html' %}

{% block title %}Delete Student{% endblock %}

{% block content %}

<h2>Delete Student</h2>

<p>
    Are you sure you want to delete
    <strong>{{ student.name }}</strong>?
</p>

<p class="warning-text">Warning: Deleting this subject will also delete all marks recorded for it for every student.</p>

<form method="POST">
    {% csrf_token %}
    <button type="submit">Confirm Delete</button>
    <a href="{% url 'subject_list' %}">Cancel</a>
</form>
{% endblock %}
