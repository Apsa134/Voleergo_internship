
{% extends 'base.html' %}

{% block content %}

<h2>Subject List</h2>

<a href="{% url 'add_subject' %}">Add Subject</a>

<table>
    <thead>
        <tr>
            <th>Subject Name</th>
            <th>Maximum Marks</th>
            <th>Pass Marks</th>
            <th>Actions</th>
        </tr>
    </thead>

    <tbody>
        {% for subject in subjects %}
        <tr>
            <td>{{ subject.name }}</td>
            <td>{{ subject.max_marks }}</td>
            <td>{{ subject.pass_marks }}</td>
            <td>
                <!-- Edit and Delete links will be added next -->
                
			<a href="{% url 'edit_subject' subject.id %}">Edit</a>
			<a href="{% url 'delete_subject' subject.id %}">Delete</a>

            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="4">No subjects available.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
